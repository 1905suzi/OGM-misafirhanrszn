<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Başarılı - OGM Misafirhane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8;">

<div style="display: flex; min-height: 100vh; width: 100%;">

    <!-- Sol Menü (Mevcut yapıyı bozmuyoruz, projenin orijinal sidebar'ı gelecek) -->
    <div th:replace="~{fragments/sidebar :: sidebar('anasayfa')}"></div>

    <!-- Sağ Taraf Ana İçerik (Tam ortalanmış kart yapısı) -->
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-left: 260px; padding: 2rem;">

        <div style="width: 100%; max-width: 420px;">

            <!-- Beyaz Kart -->
            <div style="background: white; border-radius: 16px; padding: 3rem 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.04); text-align: center; margin-bottom: 1rem;">

                <!-- Yeşil Onay İkonu -->
                <div style="width: 80px; height: 80px; background-color: #4CAF50; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
                    <i class="bi bi-check" style="color: white; font-size: 4rem;"></i>
                </div>

                <h2 style="font-size: 1.4rem; font-weight: 700; color: #111; margin: 0 0 1rem 0; line-height: 1.3;">
                    Kaydınız Başarılı<br>Olmuştur
                </h2>

                <p style="color: #222; font-size: 0.95rem; font-weight: 500; margin-bottom: 1rem;">
                    Artık rezervasyon oluşturabilirsiniz.
                </p>

                <p style="color: #666; font-size: 0.85rem; line-height: 1.6; margin: 0;">
                    Dilediğiniz zaman hesabım sayfasından<br>bilgilerinizi güncelleyebilirsiniz.
                </p>

            </div>

            <!-- Alt Buton (Tıklandığında bizim ayarladığımız misafir bilgileri formuna gider) -->
            <a href="/rezervasyon-olustur" style="display: block; width: 100%; text-align: center; background: #1c4227; color: white; padding: 1rem; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 1rem; box-sizing: border-box; transition: background 0.2s;">
                Rezervasyon Oluştur
            </a>

        </div>

    </div>
</div>

</body>
</html>
