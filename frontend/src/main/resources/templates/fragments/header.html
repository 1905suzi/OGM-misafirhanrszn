<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
  ┌─────────────────────────────────────────────┐
  │  FRAGMENT: head — HTML <head> içeriği       │
  │  Kullanım: th:replace="~{fragments/header :: head('Sayfa Adı')}" │
  └─────────────────────────────────────────────┘
-->
<th:block th:fragment="head(pageTitle)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Orman Genel Müdürlüğü Misafirhane Rezervasyon ve Yönetim Sistemi"/>
  <meta name="author" content="Orman Genel Müdürlüğü"/>
  <title th:text="${pageTitle} + ' | OGM Misafirhane'">OGM Misafirhane</title>

  <!-- Bootstrap 5.3 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous"/>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>

  <!-- Google Fonts — Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet"/>

  <!-- OGM Ana Stil -->
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</th:block>

<!-- ─────────────────────────────────────────────────────
     FRAGMENT: auth-navbar — Auth sayfası üst navbar
     ───────────────────────────────────────────────────── -->
<nav th:fragment="auth-navbar" class="auth-navbar" role="banner">

  <!-- Sol: OGM Logo + Başlık -->
  <a href="/giris" class="auth-brand">
    <!-- OGM Logo (Webp olarak güncellendi) -->
    <span class="ogm-logo">
      <img src="/ogm-logo.webp" alt="OGM Logosu" style="width: 44px; height: 44px; object-fit: contain;"/>
    </span>

    <!-- Metin -->
    <span class="auth-brand-text">
      <span class="auth-brand-org">Orman Genel Müdürlüğü</span>
      <span class="auth-brand-sys">Misafirhane Rezervasyon Sistemi</span>
    </span>
  </a>

  <!-- Sağ: SSL Güvenlik Rozeti -->
  <span class="ssl-badge">
    <i class="bi bi-shield-lock-fill"></i>
    256-bit SSL Korumalı
  </span>
</nav>

<!-- ─────────────────────────────────────────────────────
     FRAGMENT: panel-topbar — Dashboard / Admin üst bar
     ───────────────────────────────────────────────────── -->
<div th:fragment="panel-topbar(portalBasligi, kullaniciAdi)" style="background: white; padding: 1rem 2rem; border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center;">
  <div style="font-weight: 700; font-size: 1rem; color: var(--gray-900);" th:text="${portalBasligi}">
    OGM Misafirhane Rezervasyon Portalı
  </div>

  <!-- Sağ Üst Kullanıcı Alanı -->
  <div style="display: flex; align-items: center; gap: 8px; background: var(--gray-100); padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: var(--gray-800);">
    <div style="width: 28px; height: 28px; background: #245332; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem;">
      <i class="bi bi-person-fill"></i>
    </div>
    <!-- Controller'dan gelen kullanıcı adı, gelmezse varsayılan yazar -->
    <span th:text="${kullaniciAdi != null ? kullaniciAdi : 'Aylin Melike'}">Aylin Melike</span>
  </div>
</div>


  <!-- Kullanıcı Bilgisi -->
  <div class="topbar-user" role="button" tabindex="0" aria-label="Kullanıcı menüsü">
    <div class="user-avatar" aria-hidden="true">
      <i class="bi bi-person"></i>
    </div>
    <span class="user-name" th:text="${username} ?: '1 Üye'">1 Üye</span>
    <i class="bi bi-chevron-down" style="font-size:.7rem;color:var(--gray-500);"></i>
  </div>
</header>

<!-- ─────────────────────────────────────────────────────
     FRAGMENT: scripts — Ortak JS yüklemeleri (body sonu)
     ───────────────────────────────────────────────────── -->
<th:block th:fragment="scripts">
  <!-- Bootstrap Bundle (Popper dahil) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
          crossorigin="anonymous"></script>

  <!-- Mobil Sidebar Toggle -->
  <script>
    function toggleSidebar() {
      document.querySelector('.panel-sidebar')?.classList.toggle('mobile-open');
    }
    // Dışarı tıklayınca kapat
    document.addEventListener('click', e => {
      const sidebar = document.querySelector('.panel-sidebar');
      const btn     = document.querySelector('.sidebar-toggle-btn');
      if (sidebar?.classList.contains('mobile-open') &&
              !sidebar.contains(e.target) && !btn?.contains(e.target)) {
        sidebar.classList.remove('mobile-open');
      }
    });
  </script>
</th:block>

</html>
